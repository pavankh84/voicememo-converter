name: Bug report
description: Report a reproducible problem with the app
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach private recordings, transcripts, personal data, or secrets.
        For security vulnerabilities, follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select a non-sensitive sample file ...
        3. See ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Include the browser name and version.
      placeholder: Chrome 130
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, iOS 18, Android 15
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Affected feature
      options:
        - Audio conversion
        - Transcription
        - Silence trimming
        - File download or metadata
        - PWA or offline behavior
        - Layout or accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots if useful. Do not include sensitive content.
